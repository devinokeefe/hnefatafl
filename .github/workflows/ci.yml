# Formatting, lints and tests of the Rust and Python code, and the results in README.md and
# docs/RESULTS.md against the records in matches/, training/ and models/manifest.json.
#
# Not run here: the differential test of the rules against TaflZero (`tafl difftest`, which
# needs TaflZero's research probe, not distributed: `python tools/check_all.py --full`), the
# matches against TaflZero (TaflZero itself and hours on a GPU per match) and training (days on
# a GPU). Their records are checked, not made again.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run for the one before; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # The newest Rust checked, which formats and lints the code. It is pinned, so that a new
  # release's lints cannot fail CI without a change here; the rust job's matrix repeats it.
  RUST: "1.99.0"
  # The versions of the Python tools and libraries checked with.
  CONSTRAINTS: .github/constraints.txt

jobs:
  rust:
    name: Rust ${{ matrix.rust }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest supported (Cargo.toml: rust-version), with the committed Cargo.lock,
        # and the newest checked (RUST above).
        rust: ["1.85", "1.99.0"]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ matrix.rust }}
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component rustfmt,clippy --no-self-update
          rustup default ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - name: Formatting and lints
        if: matrix.rust != '1.85'
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests (test profile, with overflow checks)
        run: cargo test --locked --workspace
      - name: Tests (release build)
        run: cargo test --locked --release --workspace

  # The engine library and the tafl program, built once per OS for the Python jobs.
  engine:
    name: Engine, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST" --profile minimal --no-self-update
          rustup default "$RUST"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release -p tafl-ffi -p tafl-cli
      - uses: actions/upload-artifact@v7
        with:
          name: engine-${{ runner.os }}
          # Those of these files that the OS's build makes, at the artifact's root.
          path: |
            target/release/tafl
            target/release/tafl.exe
            target/release/libtafl_ffi.so
            target/release/libtafl_ffi.dylib
            target/release/tafl_ffi.dll
          if-no-files-found: error
          retention-days: 1

  python:
    name: Python ${{ matrix.python }}, ${{ matrix.os }}
    needs: engine
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"] # the oldest supported (pyproject.toml: requires-python) and the newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/constraints.txt
      - name: Get the engine
        uses: actions/download-artifact@v8
        with:
          name: engine-${{ runner.os }}
          path: target/release
      - name: Install PyTorch (CPU) and the package
        run: |
          # PyPI's PyTorch for macOS is CPU-only already; elsewhere the CPU build is far smaller.
          if [ "$RUNNER_OS" = macOS ]; then
            python -m pip install torch -c "$CONSTRAINTS"
          else
            python -m pip install torch -c "$CONSTRAINTS" --index-url https://download.pytorch.org/whl/cpu
          fi
          python -m pip install -e ".[dev]" -c "$CONSTRAINTS"
      - run: python -m pytest

  # The same on every OS and Python version: run once.
  python-lint:
    name: Python formatting and lints
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff -c "$CONSTRAINTS"
      - run: python -m ruff format --check python tools
      - run: python -m ruff check python tools

  # Only the standard library: every number of README.md and docs/RESULTS.md that the
  # records support, recomputed from them, and the links between the documents.
  records:
    name: Results against the records
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python tools/check_results.py --check
      - run: python tools/check_links.py
