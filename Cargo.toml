[workspace]
resolver = "3"
members = ["crates/tafl-core", "crates/tafl-engine", "crates/tafl-ffi", "crates/tafl-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

# Tests run millions of rule transitions; keep them fast.
[profile.test]
opt-level = 3
